<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Masuk / Daftar — Aplikasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#6ee7b7;
      --muted:#9aa6b2;
      --glass: rgba(255,255,255,0.04);
      --radius:14px;
      --maxw:420px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#07202a 0%, #071123 60%);
      color:#e6eef3;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .card{
      width:100%;
      max-width:var(--maxw);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      padding:28px;
      backdrop-filter: blur(6px) saturate(120%);
    }
    header h1{margin:0;font-size:20px}
    header p{margin:6px 0 18px;color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:8px;margin-bottom:18px}
    .tab{flex:1;padding:8px 12px;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);background:transparent;border:1px solid transparent}
    .tab.active{background:linear-gradient(90deg, rgba(110,231,183,0.08), rgba(110,231,183,0.04));color:var(--accent);border-color:rgba(110,231,183,0.12)}
    form{display:grid;gap:12px}
    label{font-size:13px;color:var(--muted);display:block}
    input[type="text"], input[type="email"], input[type="password"]{
      width:100%;
      padding:12px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.06);
      background:var(--glass);
      color:inherit;
      outline:none;
      font-size:14px;
    }
    input:focus{box-shadow:0 6px 18px rgba(110,231,183,0.06);border-color:rgba(110,231,183,0.14)}
    .row{display:flex;gap:10px}
    .row .half{flex:1}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
    .btn{
      background:linear-gradient(90deg,var(--accent), #34d399);
      color:#052022;
      padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:14px;box-shadow:0 6px 18px rgba(52,211,153,0.12)
    }
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}
    .small{font-size:13px;color:var(--muted)}
    .link-like{color:var(--accent);cursor:pointer;font-weight:600}
    .foot{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
    .error{color:#ffb4b4;font-size:13px}
    .success{color:#b8f5d8;font-size:13px}
    .password-wrapper{position:relative}
    .toggle-pass{position:absolute;right:8px;top:8px;padding:6px;border-radius:8px;border:none;background:transparent;cursor:pointer;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Akses Akun</h1>
      <p>Silakan masuk atau daftar jika belum punya akun.</p>
    </header>
    <nav class="tabs">
      <button id="tab-login" class="tab active">Masuk</button>
      <button id="tab-register" class="tab">Daftar</button>
    </nav>
    <section id="login-panel">
      <form id="login-form">
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required placeholder="nama@contoh.com">
        </div>
        <div>
          <label for="login-password">Kata sandi</label>
          <div class="password-wrapper">
            <input id="login-password" type="password" required placeholder="Masukkan kata sandi">
            <button type="button" class="toggle-pass" data-target="login-password">👁️</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit">Masuk</button>
          <button type="button" class="ghost" id="forgot">Lupa?</button>
        </div>
        <div id="login-msg"></div>
      </form>
    </section>
    <section id="register-panel" style="display:none">
      <form id="register-form">
        <div>
          <label for="reg-name">Nama lengkap</label>
          <input id="reg-name" type="text" required placeholder="Nama Anda">
        </div>
        <div>
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" required placeholder="nama@contoh.com">
        </div>
        <div class="row">
          <div class="half">
            <label for="reg-password">Kata sandi</label>
            <div class="password-wrapper">
              <input id="reg-password" type="password" required minlength="8" placeholder="Minimal 8 karakter">
              <button type="button" class="toggle-pass" data-target="reg-password">👁️</button>
            </div>
          </div>
          <div class="half">
            <label for="reg-password2">Konfirmasi</label>
            <div class="password-wrapper">
              <input id="reg-password2" type="password" required minlength="8" placeholder="Ketik ulang kata sandi">
              <button type="button" class="toggle-pass" data-target="reg-password2">👁️</button>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <input id="tos" type="checkbox" required>
          <label for="tos" class="small">Saya menyetujui <span class="link-like">Syarat & Ketentuan</span></label>
        </div>
        <div class="actions">
          <button class="btn" type="submit">Buat akun</button>
          <button type="button" class="ghost" id="to-login">Sudah punya akun?</button>
        </div>
        <div id="reg-msg"></div>
      </form>
    </section>
  </main>
  <script>
    const tabLogin=document.getElementById('tab-login'),tabReg=document.getElementById('tab-register'),loginPanel=document.getElementById('login-panel'),regPanel=document.getElementById('register-panel');function showLogin(){tabLogin.classList.add('active');tabReg.classList.remove('active');loginPanel.style.display='block';regPanel.style.display='none'}function showRegister(){tabReg.classList.add('active');tabLogin.classList.remove('active');regPanel.style.display='block';loginPanel.style.display='none'}tabLogin.onclick=showLogin;tabReg.onclick=showRegister;document.getElementById('to-login').onclick=showLogin;document.querySelectorAll('.toggle-pass').forEach(btn=>{btn.onclick=()=>{const t=document.getElementById(btn.dataset.target);t.type=t.type==='password'?'text':'password';btn.textContent=t.type==='text'?'🙈':'👁️'}});
  </script>
</body>
</html>
